name: TestSprite
description: >-
  TestSprite is an AI-powered software testing platform (a Techstars-backed
  company) that gives autonomous coding agents a verification loop: it uses an
  app like a real user, generates and executes end-to-end UI and backend API
  tests, and returns actionable failure bundles (screenshots, DOM snapshots,
  root causes, and fix suggestions) so an agent can repair its own work before
  bugs ship. It is delivered as an official Model Context Protocol (MCP) server
  that runs inside AI coding assistants (Cursor, Claude Code, VS Code, Copilot),
  a first-party command-line interface for terminal and CI/CD use, a browser Web
  Portal, and a GitHub App that tests every pull request. Authentication is by
  scoped API key.
